name: CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serviai
          POSTGRES_USER: serviai
          POSTGRES_PASSWORD: serviai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serviai -d serviai"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://serviai:serviai@localhost:5432/serviai
      ULTRAVOX_API_KEY: ci_test_ultravox_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Backend test suite (excludes test_endpoints.py / test_kpis.py / test_db.py / test_db_user.py / test_db_validation.py - hardcoded staging DB creds, no network to staging from CI)
        working-directory: backend
        run: |
          modules=$(ls test_*.py | grep -v -e test_endpoints.py -e test_kpis.py -e test_db.py -e test_db_user.py -e test_db_validation.py | sed 's/\.py$//')
          status=0
          for module in $modules; do
            # Most test modules pin DATABASE_URL to their own sqlite file at import time,
            # but app.db.session builds its engine once per process, so batching modules
            # into a single unittest run makes them silently share (and corrupt) one DB.
            python -m unittest "$module" || status=1
          done
          exit $status
      - name: Compile check
        working-directory: backend
        run: python -m compileall app
      - name: Lint (ruff)
        working-directory: backend
        run: uvx ruff check app

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install --legacy-peer-deps
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npx tsc --noEmit --incremental false
      - working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend
        run: curl -sf -X POST "${{ secrets.DOKPLOY_FRONTEND_WEBHOOK }}"
      - name: Deploy Backend
        run: curl -sf -X POST "${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}"
